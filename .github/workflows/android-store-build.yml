name: Android signed bundle (build only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leafellow-android-store-build
  cancel-in-progress: false
jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and check before accessing signing credentials
        run: |
          pnpm install --frozen-lockfile
          python3 -m unittest discover -s tests -v
          pnpm test
          pnpm typecheck
          pnpm --filter @leafellow/mobile typecheck
      - name: Build and verify signed AAB (never upload to Play)
        env:
          KEYSTORE_BASE64: ${{ secrets.LEAFELLOW_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEAFELLOW_UPLOAD_KEYSTORE_PASSWORD }}
          LEAFELLOW_UPLOAD_KEYSTORE: ${{ runner.temp }}/leafellow-upload.p12
          LEAFELLOW_UPLOAD_PASSWORD_FILE: ${{ runner.temp }}/leafellow-upload.password
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib
          key = os.environ['KEYSTORE_BASE64']
          password = os.environ['KEYSTORE_PASSWORD']
          if not key or not password:
              raise SystemExit('Protected android-signing environment secrets are required')
          pathlib.Path(os.environ['LEAFELLOW_UPLOAD_KEYSTORE']).write_bytes(base64.b64decode(key, validate=True))
          pathlib.Path(os.environ['LEAFELLOW_UPLOAD_PASSWORD_FILE']).write_text(password + '\n')
          PY
          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD
          bash scripts/android-store-build.sh
          cd apps/mobile/android/app/build/outputs/bundle/release
          sha256sum app-release.aab > app-release.aab.sha256
      - name: Delete temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/leafellow-upload.p12" "$RUNNER_TEMP/leafellow-upload.password"
      - name: Archive bundle only (not credentials)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leafellow-signed-aab-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
