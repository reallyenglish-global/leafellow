name: Signed Android release artifacts (build only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused positive Play versionCode (owner must check Play history)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leafellow-android-signing
  cancel-in-progress: false

jobs:
  unsigned-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      # Dispatch inputs are passed as data, never interpolated into shell code.
      LEAFELLOW_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Validate dispatch input as data before dependency execution
        run: node -e 'require("./apps/mobile/app.config.js")({config:require("./apps/mobile/app.json").expo})'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=low
      - run: pnpm typecheck && pnpm --filter @leafellow/mobile typecheck && pnpm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exercise real archive-signature security regression tests
        run: python3 -m unittest discover -s tests -v
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0 cmdline-tools;latest
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile unsigned release APK and AAB with no credentials
        run: |
          pnpm --filter @leafellow/mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          ./gradlew :app:assembleRelease :app:bundleRelease --init-script "$GITHUB_WORKSPACE/scripts/android-unsigned.init.gradle" -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --max-workers=2 --no-daemon
      - name: Stage unsigned inputs only
        run: |
          mkdir -p unsigned-artifacts
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab unsigned-artifacts/
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leafellow-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: unsigned-artifacts/
          if-no-files-found: error
          retention-days: 1

  signed-artifacts:
    needs: unsigned-build
    if: github.ref == 'refs/heads/main'
    # Separate fresh VM: no npm, Expo, Gradle, build output execution or caches here.
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEAFELLOW_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0 cmdline-tools;latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leafellow-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: unsigned-artifacts/
      - name: Fetch independently pinned bundletool
        run: curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
      - name: Independently inspect actual bundle before secrets enter scope
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/mobile/app.json"))["expo"]["version"])')"
          python3 scripts/verify-play-artifact.py unsigned-artifacts/app-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --package com.reallyenglish.leafellow --version-code "$LEAFELLOW_ANDROID_VERSION_CODE" --version-name "$VERSION" --output release-artifacts
      - name: Sign artifacts and verify expected upload certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.LEAFELLOW_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEAFELLOW_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$(mktemp -d "$RUNNER_TEMP/leafellow-signing.XXXXXX")"
          export KEY_DIR
          trap 'rm -rf "$KEY_DIR"' EXIT
          export LEAFELLOW_UPLOAD_KEYSTORE="$KEY_DIR/upload.p12"
          export LEAFELLOW_UPLOAD_PASSWORD_FILE="$KEY_DIR/upload.password"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          if not os.environ['KEYSTORE_BASE64'] or not os.environ['KEYSTORE_PASSWORD']:
              raise SystemExit('Required signing secrets are missing')
          Path(os.environ['LEAFELLOW_UPLOAD_KEYSTORE']).write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          Path(os.environ['LEAFELLOW_UPLOAD_PASSWORD_FILE']).write_text(os.environ['KEYSTORE_PASSWORD'] + '\n')
          PY
          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD
          keytool -exportcert -keystore "$LEAFELLOW_UPLOAD_KEYSTORE" -storepass:file "$LEAFELLOW_UPLOAD_PASSWORD_FILE" -alias leafellow-upload -file "$KEY_DIR/expected.der"
          EXPECTED="$(sha256sum "$KEY_DIR/expected.der" | cut -d' ' -f1)"
          cp unsigned-artifacts/app-release.aab release-artifacts/leafellow-release.aab
          jarsigner -keystore "$LEAFELLOW_UPLOAD_KEYSTORE" -storepass:file "$LEAFELLOW_UPLOAD_PASSWORD_FILE" -keypass:file "$LEAFELLOW_UPLOAD_PASSWORD_FILE" release-artifacts/leafellow-release.aab leafellow-upload
          python3 scripts/verify-upload-signature.py release-artifacts/leafellow-release.aab
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f 4 unsigned-artifacts/app-release-unsigned.apk "$KEY_DIR/aligned.apk"
          "$BT/apksigner" sign --ks "$LEAFELLOW_UPLOAD_KEYSTORE" --ks-key-alias leafellow-upload --ks-pass "file:$LEAFELLOW_UPLOAD_PASSWORD_FILE" --key-pass "file:$LEAFELLOW_UPLOAD_PASSWORD_FILE" --out release-artifacts/leafellow-release.apk "$KEY_DIR/aligned.apk"
          "$BT/zipalign" -c -P 16 4 release-artifacts/leafellow-release.apk
          "$BT/apksigner" verify --verbose --print-certs release-artifacts/leafellow-release.apk > release-artifacts/apk-signature.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-artifacts/apk-signature.txt)"
          test "$EXPECTED" = "$ACTUAL"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print release-artifacts/leafellow-release.apk > release-artifacts/apk-manifest.xml
          printf 'sourceSha=%s\nversionCode=%s\nuploadCertificateSha256=%s\n' "$GITHUB_SHA" "$LEAFELLOW_ANDROID_VERSION_CODE" "$EXPECTED" > release-artifacts/provenance.txt
          (cd release-artifacts && sha256sum leafellow-release.aab leafellow-release.apk > SHA256SUMS)
      - name: Verify final signed AAB bytes and APK manifest (no secrets in scope)
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/mobile/app.json"))["expo"]["version"])')"
          python3 scripts/verify-play-artifact.py release-artifacts/leafellow-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --package com.reallyenglish.leafellow --version-code "$LEAFELLOW_ANDROID_VERSION_CODE" --version-name "$VERSION" --output release-artifacts --apk-manifest release-artifacts/apk-manifest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leafellow-signed-android-${{ inputs.version_code }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
