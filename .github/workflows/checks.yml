name: Foundation, core, and mobile checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate brand assets and project foundation
        run: python3 -m unittest discover -s tests -v
      - name: Check committed whitespace
        run: git diff-tree --check --root HEAD
  core-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check shared and mobile code
        run: |
          pnpm typecheck
          pnpm --filter @leafellow/mobile typecheck
      - name: Lint mobile code
        run: pnpm --filter @leafellow/mobile lint
      - name: Test shared import and annotation contracts
        run: pnpm test
      - name: Test mobile components with the engine mocked
        run: pnpm --filter @leafellow/mobile test
      - name: Check Expo SDK dependency compatibility
        run: pnpm --filter @leafellow/mobile exec expo install --check
      - name: Diagnose Expo project configuration
        run: pnpm --filter @leafellow/mobile exec expo-doctor
      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level high
