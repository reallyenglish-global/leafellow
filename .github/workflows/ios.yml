name: iOS simulator build and smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Expo dependencies and app types
        run: |
          pnpm --filter @leafellow/mobile exec expo install --check
          pnpm --filter @leafellow/mobile exec expo-doctor
          pnpm --filter @leafellow/mobile typecheck
          pnpm test
      - name: Record Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Generate the iOS project from Expo config
        run: pnpm --filter @leafellow/mobile prebuild:ios
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=apps/mobile/ios
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator found on this macOS runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build the iOS app for Simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild \
            -workspace apps/mobile/ios/Leafellow.xcworkspace \
            -scheme Leafellow \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/LeafellowDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install, launch, and capture simulator smoke test
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP="$RUNNER_TEMP/LeafellowDerivedData/Build/Products/Release-iphonesimulator/Leafellow.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/leafellow-iphone.png"
          test -s "$RUNNER_TEMP/leafellow-iphone.png"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Leafellow-iOS-Simulator.app.zip"
      - name: Upload simulator build and launch screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leafellow-ios-simulator-build
          path: |
            ${{ runner.temp }}/Leafellow-iOS-Simulator.app.zip
            ${{ runner.temp }}/leafellow-iphone.png
          if-no-files-found: error
          retention-days: 7
