name: iOS simulator build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reader_acceptance:
        description: Run the real reader lifecycle on a dedicated iOS simulator
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Expo dependencies and app types
        run: |
          pnpm --filter @leafellow/mobile exec expo install --check
          pnpm --filter @leafellow/mobile exec expo-doctor
          pnpm --filter @leafellow/mobile typecheck
          pnpm test
      - name: Record Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Generate the iOS project from Expo config
        run: pnpm --filter @leafellow/mobile prebuild:ios
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator found on this macOS runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build the iOS app for Simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild \
            -workspace apps/mobile/ios/Leafellow.xcworkspace \
            -scheme Leafellow \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/LeafellowDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install, launch, and capture simulator smoke test
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP="$RUNNER_TEMP/LeafellowDerivedData/Build/Products/Release-iphonesimulator/Leafellow.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/leafellow-iphone.png"
          test -s "$RUNNER_TEMP/leafellow-iphone.png"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Leafellow-iOS-Simulator.app.zip"
          python3 scripts/ios_app_artifact.py record "$RUNNER_TEMP" \
            --sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload simulator build and launch screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leafellow-ios-simulator-build
          path: |
            ${{ runner.temp }}/Leafellow-iOS-Simulator.app.zip
            ${{ runner.temp }}/Leafellow-iOS-Simulator.app.zip.sha256
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/leafellow-iphone.png
          if-no-files-found: error
          retention-days: 7

  ios-reader:
    name: iOS reader acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.reader_acceptance
    needs: ios
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAESTRO_VERSION: 2.12.0
      MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the exact Release simulator app from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: leafellow-ios-simulator-build
          path: ${{ runner.temp }}/ios-app
      - name: Verify source provenance and zip sha256 before extraction
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ios_app_artifact.py verify "$RUNNER_TEMP/ios-app" \
            --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID"
          ditto -x -k "$RUNNER_TEMP/ios-app/Leafellow-iOS-Simulator.app.zip" "$RUNNER_TEMP/ios-app"
      - name: Install the verified Maestro release archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-dl"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/maestro-dl/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro-dl/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro-dl/maestro.zip" -d "$RUNNER_TEMP/maestro-dl"
          echo "$RUNNER_TEMP/maestro-dl/maestro/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maestro-dl/maestro/bin/maestro" --version
      - name: Create and boot a dedicated iPhone 17 on iOS 26.5
        id: reader-simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          DEVICE_ID="$(xcrun simctl create "LeafellowAcceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-5)"
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Exercise the actual picker and reader lifecycle
        env:
          SIMULATOR_ID: ${{ steps.reader-simulator.outputs.udid }}
        run: |
          set -euo pipefail
          python3 scripts/android_fixture_epub.py "$RUNNER_TEMP/ios-fixture"
          python3 scripts/ios_acceptance.py --simulator "$SIMULATOR_ID" \
            --simulator-name "LeafellowAcceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --app "$RUNNER_TEMP/ios-app/Leafellow.app" \
            --fixture-dir "$RUNNER_TEMP/ios-fixture" --out "$RUNNER_TEMP/ios-acceptance"
      - name: Upload native acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leafellow-ios-reader-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-acceptance/
            ${{ runner.temp }}/ios-fixture/leafellow-fixture.json
            ${{ runner.temp }}/ios-app/provenance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only the simulator this job created
        if: always() && steps.reader-simulator.outputs.udid != ''
        env:
          SIMULATOR_ID: ${{ steps.reader-simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID"
